{% extends "base.html" %}
{% block content %}

    <h2 class="mt-2 mb-3">{{ title }}</h2>

    <div class="row">
        <div class="col-sm-12 mb-3">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Посмотреть список направлений и их учебные планы</p>
                    <a href="{{ url_for('directions') }}" class="btn btn-primary">Учебные планы</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Редактировать существующий учебный план</p>
                    <a href="{{ url_for('updateEdplan') }}" class="btn btn-primary">Редактировать</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Добавить новый учебный план</p>
                    <a href="{{ url_for('insertPlanForm') }}" class="btn btn-primary">Добавить</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Удалить существующий учебный план</p>
                    <a href="{{ url_for('deleteEdplan') }}" class="btn btn-primary">Удалить</a>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
