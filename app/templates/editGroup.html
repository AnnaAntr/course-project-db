{% extends "base.html" %}
{% block content %}

    <h2 class="mt-2 mb-3">{{ title }}</h2>

    <div class="row">
        <div class="col-sm-12 mb-3">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Посмотреть список групп</p>
                    <a href="{{ url_for('groups') }}" class="btn btn-primary">Список групп</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Редактировать существующую группу</p>
                    <a href="{{ url_for('updateGroupForm') }}" class="btn btn-primary">Редактировать</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Добавить новую группу</p>
                    <a href="{{ url_for('insertGroupForm') }}" class="btn btn-primary">Добавить</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Удалить существующую группу</p>
                    <a href="{{ url_for('deleteGroupForm') }}" class="btn btn-primary">Удалить</a>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
