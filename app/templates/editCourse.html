{% extends "base.html" %}
{% block content %}

    <h2 class="mt-2 mb-3">{{ title }}</h2>

    <div class="row">
        <div class="col-sm-12 mb-3">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Посмотреть список предметов</p>
                    <a href="{{ url_for('courses') }}" class="btn btn-primary">Список предметов</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Редактировать существующий предмет</p>
                    <a href="{{ url_for('updateCourseForm') }}" class="btn btn-primary">Редактировать</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Добавить новый предмет</p>
                    <a href="{{ url_for('insertCourseForm') }}" class="btn btn-primary">Добавить</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Удалить существующий предмет</p>
                    <a href="{{ url_for('deleteCourseForm') }}" class="btn btn-primary">Удалить</a>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
