{% extends "base.html" %}
{% block content %}

    <h2 class="mt-2 mb-3">{{ title }}</h2>

    <div class="row">
        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Редактировать существующее расписание</p>
                    <a href="{{ url_for('chooseGroupForm') }}" class="btn btn-primary">Редактировать</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Добавить новое расписание</p>
                    <a href="{{ url_for('insertScheduleForm') }}" class="btn btn-primary">Добавить</a>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <div class="card">
                <div class="card-body">
                    <p class="card-text">Удалить существующее расписание</p>
                    <a href="{{ url_for('deleteScheduleForm') }}" class="btn btn-primary">Удалить</a>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
