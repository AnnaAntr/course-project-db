{% extends "base.html" %}
{% block content %}

    <h2 class="mt-2">{{ title }}</h2>
    {% if courses|length == 0 %}
        <p>Предметов не найдено.</p>
    {% else %}
        <table class="table table-bordered table-hover">
            <thead class="text-center table-primary">
                <tr>
                    <th>Название</th>
                </tr>
            </thead>
            <tbody>
            {% for c in courses %}
                <tr>
                    <td>{{ c[0] }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    {% endif %}

{% endblock %}
